name: air_canvas
description: A Air Canvas app that turns your phone/tablet into a wireless graphics tablet over WiFi.
publish_to: 'none'
version: 1.5.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  web_socket_channel: ^2.4.0
  network_info_plus: ^4.1.0
  wakelock_plus: ^1.2.5
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  shelf_web_socket: ^1.0.4
  shelf: ^1.4.1
  google_fonts: ^6.2.1
  # lib/services/secure_channel.dart এর জন্য — AES-256-CBC আর PBKDF2 (pointycastle),
  # SHA-256 আর HMAC-SHA256 (crypto)। যোগ করার পর একবার `flutter pub get` চালাতে হবে।
  pointycastle: ^3.9.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  image_path: "assets/logo.png"
